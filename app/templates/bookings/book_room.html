{% extends "base.html" %}
{% from 'bootstrap5/form.html' import render_form %}

{% block content %}
<h1>Бронирование</h1>
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">{{ room[4] }} – {{ room[1] }}</div>
            <div class="card-body">
                <p>Вместимость: {{ room[2] }} чел. | Цена: {{ "%.0f"|format(room[3]) }} ₽/ночь</p>
                <hr>
                {{ render_form(form) }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
