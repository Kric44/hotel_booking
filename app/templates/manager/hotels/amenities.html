{% extends "base.html" %}

{% block content %}
<p><a href="{{ url_for('manager_hotels') }}">← Назад</a></p>
<h1>Удобства: {{ hotel[1] }}</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            {% if all_amenities|length == 0 %}
                <p>Удобства не добавлены. <a href="{{ url_for('manager_amenities') }}">Добавить</a></p>
            {% else %}
                <div class="row">
                    {% for a in all_amenities %}
                    <div class="col-md-4 mb-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="amenities" value="{{ a[0] }}" id="a{{ a[0] }}" {% if a[0] in current_ids %}checked{% endif %}>
                            <label class="form-check-label" for="a{{ a[0] }}">{{ a[1] }}</label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                <hr>
                <button class="btn btn-success">Сохранить</button>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
