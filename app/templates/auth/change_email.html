{% extends "base.html" %}
{% from 'bootstrap5/form.html' import render_form %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h3>Изменение email</h3></div>
            <div class="card-body">
                <p>Текущий: <strong>{{ current_user.email }}</strong></p>
                {{ render_form(form) }}
            </div>
            <div class="card-footer">
                <a href="{{ url_for('profile') }}">Назад</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
