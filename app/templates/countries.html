{% extends "base.html" %}

{% block content %}
    <h1>Countries</h1>
    <p class="lead">Explore hotels in these countries:</p>
    
    {% if countries|length == 0 %}
        <div class="alert alert-info">No countries found.</div>
    {% else %}
        <div class="row">
            {% for country in countries %}
                <div class="col-md-4 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">{{ country[1] }}</h5>
                            <a href="{{ url_for('country_hotels', country_id=country[0]) }}" class="btn btn-outline-primary">View Hotels</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endblock %}
